server:
  port: 8080

spring:
  application:
    name: smart-ecommerce-backend
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGODB_HOST:localhost}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:smart_ecommerce_db}}
      auto-index-creation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  seed:
    enabled: ${APP_SEED_ENABLED:true}
